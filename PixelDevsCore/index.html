<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelDevs Ops - Yetkili Başvurusu</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/icons/icon.png">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Stil Dosyası -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sol Üst Köşe Logo & Hover Yazı Alanı -->
    <div class="brand-logo-container">
        <div class="logo-box">
            <img src="images/icons/icon.png" alt="PixelDevs Logo">
        </div>
        <span class="brand-name">The Pixel Devs</span>
    </div>

    <!-- Arkaplan Dinamik Işık Efektleri -->
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>

    <div class="container">
        <div class="header">
            <div class="badge-glow">
                <span class="badge">PIXELDEVS OPS</span>
            </div>
            <h1>Operasyon Kadrosu</h1>
            <p>Sisteme dahil olmak ve ekibe katılmak için başvurunu ilet.</p>
        </div>

        <form id="modForm">
            <div class="form-group">
                <label for="discord">Discord Kullanıcı Adı</label>
                <div class="input-container">
                    <input type="text" id="discord" required placeholder="ornek#0000" autocomplete="off">
                    <div class="input-focus-border"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="age">Yaş</label>
                <div class="input-container">
                    <input type="number" id="age" required min="10" max="99" placeholder="Yaşını gir">
                    <div class="input-focus-border"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="activeTime">Günlük Aktiflik Süresi</label>
                <div class="input-container">
                    <input type="text" id="activeTime" required placeholder="Örn: Hafta içi 5 saat, Hafta sonu 8 saat">
                    <div class="input-focus-border"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="experience">Önceki Deneyimler</label>
                <div class="input-container">
                    <textarea id="experience" required placeholder="Daha önce hangi projelerde veya sunucularda görev yaptın?"></textarea>
                    <div class="input-focus-border"></div>
                </div>
            </div>

            <div class="form-group">
                <label for="whyYou">Neden Seni Seçmeliyiz?</label>
                <div class="input-container">
                    <textarea id="whyYou" required placeholder="Kendinden bahset, ekibe katabileceğin değerler nelerdir?"></textarea>
                    <div class="input-focus-border"></div>
                </div>
            </div>

            <button type="submit" class="btn-submit">
                <span class="btn-text">Başvuruyu Gönder</span>
                <div class="btn-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </div>
            </button>
            
            <div class="footer-note">
                <span>⚡ Başvurular şifrelenmiş kanallara düşer ve ekibimiz tarafından titizlikle incelenir.</span>
            </div>
        </form>
    </div>

    <!-- Script Dosyası -->
    <script src="script.js"></script>

</body>
</html>
